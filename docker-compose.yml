services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: pokegames-backend
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: pokegames-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
